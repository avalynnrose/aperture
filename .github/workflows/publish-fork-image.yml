name: Publish fork image (manual)

# Manual only. Builds the fork image from the selected ref and pushes a versioned tag to GHCR
# using this workflow's own GITHUB_TOKEN (no personal token, no other secrets, no 'latest' tag).
# The exact pushed image is also saved as a short-lived workflow artifact so it can be tested
# elsewhere without registry credentials.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag, e.g. v0.7.10-fork.1'
        required: true
        type: string
      upstream_commit:
        description: 'Upstream commit this build derives from'
        required: true
        type: string
        default: '99cc9369df2cc675c7024f69239c3a9c6248a31d'
      confirm:
        description: 'Type "publish" to confirm pushing to GHCR'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-fork-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/aperture
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          UPSTREAM: ${{ inputs.upstream_commit }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "publish" ] || { echo "confirm must be exactly 'publish'"; exit 1; }
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-fork\.[0-9]+)?$' || { echo "version must look like v0.7.10-fork.1"; exit 1; }
          echo "$UPSTREAM" | grep -Eq '^[0-9a-f]{40}$' || { echo "upstream_commit must be a full 40-character sha"; exit 1; }

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=aperture (fork)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.aperture-fork.upstream-commit=${{ inputs.upstream_commit }}
            org.aperture-fork.upstream-version=v0.7.10

      - name: Save the pushed image as an artifact (for testing without registry login)
        run: |
          docker pull "$IMAGE:${{ inputs.version }}"
          docker save "$IMAGE:${{ inputs.version }}" | gzip > aperture-image.tar.gz
          docker image inspect "$IMAGE:${{ inputs.version }}" --format '{{.Id}}' > image-id.txt
          ls -la aperture-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: aperture-image-${{ inputs.version }}
          path: |
            aperture-image.tar.gz
            image-id.txt
          retention-days: 3

      - name: Summary
        run: |
          {
            echo "### Published ${{ env.IMAGE }}:${{ inputs.version }}"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Fork commit: \`${{ github.sha }}\`"
            echo "- Derived from upstream commit: \`${{ inputs.upstream_commit }}\` (v0.7.10)"
          } >> "$GITHUB_STEP_SUMMARY"
