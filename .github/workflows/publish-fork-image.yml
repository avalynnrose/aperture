name: Publish fork image (manual)

# Manual only. Builds the fork image from a release TAG and pushes the same versioned tag to GHCR
# using this workflow's own GITHUB_TOKEN (no personal token, no other secrets, no 'latest' tag).
#
# Safeguards:
#  - must be started from a tag named v<x.y.z>-fork.<n> (dispatch with --ref <tag>);
#  - the 'version' input must equal that tag, and the tag must point at the commit being built;
#  - the job uses the 'ghcr-publish' environment, which requires a human approval before it runs;
#  - third-party actions are pinned to commit SHAs.
# The exact pushed image is also saved as a short-lived workflow artifact so it can be tested
# elsewhere without registry credentials.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag, e.g. v0.7.10-fork.1'
        required: true
        type: string
      upstream_commit:
        description: 'Upstream commit this build derives from'
        required: true
        type: string
        default: '99cc9369df2cc675c7024f69239c3a9c6248a31d'
      confirm:
        description: 'Type "publish" to confirm pushing to GHCR'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-fork-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref_type == 'tag'
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/aperture
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          UPSTREAM: ${{ inputs.upstream_commit }}
          CONFIRM: ${{ inputs.confirm }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [ "$REF_NAME" = "$VERSION" ] || { echo "version input ($VERSION) must equal the tag this run was started from ($REF_NAME)"; exit 1; }
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$' || { echo "version must look like v0.7.10-fork.1"; exit 1; }
          [ "$CONFIRM" = "publish" ] || { echo "confirm must be exactly 'publish'"; exit 1; }
          echo "$UPSTREAM" | grep -Eq '^[0-9a-f]{40}$' || { echo "upstream_commit must be a full 40-character sha"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check the tag points at the commit being built
        env:
          VERSION: ${{ inputs.version }}
          UPSTREAM: ${{ inputs.upstream_commit }}
          BUILT_SHA: ${{ github.sha }}
        run: |
          [ "$(git rev-parse "$VERSION^{commit}")" = "$BUILT_SHA" ] || { echo "tag does not point at the built commit"; exit 1; }
          git merge-base --is-ancestor "$UPSTREAM" "$BUILT_SHA" || { echo "upstream_commit is not an ancestor of the built commit"; exit 1; }

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=aperture (fork)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.aperture-fork.upstream-commit=${{ inputs.upstream_commit }}
            org.aperture-fork.upstream-version=v0.7.10

      - name: Save the pushed image as an artifact (for testing without registry login)
        run: |
          docker pull "$IMAGE:${{ inputs.version }}"
          docker save "$IMAGE:${{ inputs.version }}" | gzip > aperture-image.tar.gz
          docker image inspect "$IMAGE:${{ inputs.version }}" --format '{{.Id}}' > image-id.txt
          ls -la aperture-image.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aperture-image-${{ inputs.version }}
          path: |
            aperture-image.tar.gz
            image-id.txt
          retention-days: 3

      - name: Summary
        run: |
          {
            echo "### Published ${{ env.IMAGE }}:${{ inputs.version }}"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Fork commit: \`${{ github.sha }}\`"
            echo "- Derived from upstream commit: \`${{ inputs.upstream_commit }}\` (v0.7.10)"
          } >> "$GITHUB_STEP_SUMMARY"
