name: Build test image (no publishing)

# Manual only. Builds the image from the ref this run is started from and attaches it to the run as
# a short-lived download so it can be tested elsewhere (for example a disposable staging stack).
# It cannot publish: read-only token, no registry login, no push, no secrets, no environment.

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Label recorded in the image, e.g. v0.7.10-fork.2-rc'
        required: true
        type: string
        default: 'test'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (linux/amd64), keep locally, do not push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          tags: aperture-fork:test
          labels: |
            org.opencontainers.image.title=aperture (fork, test build)
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.label }}
          outputs: type=docker,dest=/tmp/aperture-image.tar

      - name: Compress and fingerprint
        run: |
          gzip -c /tmp/aperture-image.tar > aperture-image.tar.gz
          sha256sum aperture-image.tar.gz > aperture-image.sha256
          echo "${{ github.sha }}" > source-commit.txt
          ls -la aperture-image.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aperture-test-image-${{ inputs.label }}
          path: |
            aperture-image.tar.gz
            aperture-image.sha256
            source-commit.txt
          retention-days: 3
