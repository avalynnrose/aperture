name: CI checks (fork)

# Read-only verification for pull requests: unit tests, typecheck, lint, build, and a
# migration replay against a throwaway Postgres service container.
# No registry login, no packages permission, no secrets, no deployment.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: '0'
      PGPASSWORD: ci-throwaway
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Public-content check (no private addresses, emails or tokens in added lines)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # This repository is public. Added lines must not contain private IP addresses, personal
          # email addresses, secret-looking tokens or private keys. GitHub no-reply and example
          # addresses are fine.
          hits=$(git diff -U0 "origin/$BASE_REF"...HEAD -- . ':!pnpm-lock.yaml' \
            | grep '^+' | grep -v '^+++' \
            | grep -n -E '(^|[^0-9])(192\.168\.|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.)|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|ghp_[A-Za-z0-9]{20,}|github_pat_|BEGIN [A-Z ]*PRIVATE KEY' \
            | grep -v -i -E 'noreply@|@example\.(com|invalid)|@users\.noreply' || true)
          if [ -n "$hits" ]; then echo "Possible private content in added lines:"; echo "$hits"; exit 1; fi
          echo "no private addresses, emails or tokens in added lines"

      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm install --frozen-lockfile

      - name: Unit tests (Top Picks auto-request helpers)
        run: pnpm --filter "./packages/*" run build && pnpm --filter @aperture/core run test:topPicks

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build all workspaces
        run: pnpm -r build

      - name: Replay all migrations on a throwaway database
        run: |
          for f in $(ls db/migrations/*.sql | sort); do
            psql -q -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f "$f" > /dev/null
          done
          psql -h localhost -U postgres -d ci -Atc "select auto_request_seerr_user_id is null, series_auto_request_seasons from top_picks_config" | tee defaults.txt
          test "$(cat defaults.txt)" = "t|all"
          test "$(psql -h localhost -U postgres -d ci -Atc "select movies_auto_request_rules = '{}'::jsonb and series_auto_request_rules = '{}'::jsonb from top_picks_config")" = "t"

      - name: Auto-request integration tests (Postgres + mock Seerr + fake TMDB)
        env:
          DATABASE_URL: postgres://postgres:ci-throwaway@localhost:5432/ci
          AR_INTEGRATION: '1'
        run: pnpm --filter @aperture/core exec node --import tsx --test src/topPicks/autoRequest.integration.test.ts
