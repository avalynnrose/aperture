# =============================================================================
# Aperture (independently maintained fork) - build from source
# =============================================================================
# This builds the image on YOUR machine from this repository, so it works while the
# fork's container image is not publicly pullable. Nothing is downloaded from the
# fork owner's registry.
#
#   git clone https://github.com/avalynnrose/aperture.git && cd aperture
#   git checkout v0.7.10-fork.5          # an exact release tag (see docs/fork/releases.md)
#   cp docker-compose.fork.yml docker-compose.local.yml   # then edit the 3 marked values
#   docker compose -f docker-compose.local.yml build      # needs about 4 GB of free RAM
#   docker compose -f docker-compose.local.yml up -d
#
# Open http://YOUR_SERVER_IP:3456 and complete the setup wizard.
#
# Upgrading or rolling back: read docs/fork/upgrading-and-rollback.md first. Take a database
# backup before upgrading.
#
# Edit these three things before starting:
#   1. APP_BASE_URL    - the address you will open Aperture at
#   2. SESSION_SECRET  - a random string of at least 32 characters (keep the quotes)
#   3. the three volume paths under "volumes:" (see the comments in docker-compose.prod.yml)
# Also change the database password below if the database port is ever exposed.
# =============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aperture-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: aperture
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d aperture']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: aperture-fork:local
    container_name: aperture
    # Run as root to avoid permission issues with bind mounts on Unraid/NAS
    user: root
    environment:
      NODE_ENV: production
      PORT: 3456
      DATABASE_URL: postgres://app:app@db:5432/aperture
      RUN_MIGRATIONS_ON_START: 'true'
      # Timezone for scheduled jobs (IANA format)
      TZ: America/New_York
      # =========================================================================
      # REQUIRED: Set these before starting!
      # =========================================================================
      # Your server's IP address or hostname
      APP_BASE_URL: http://YOUR_SERVER_IP:3456
      # Session secret - MUST be a random string at least 32 characters
      # Generate one at: https://randomkeygen.com/ (use "Fort Knox Passwords")
      # ⚠️  IMPORTANT: Keep the quotes! Special characters like # break YAML without them.
      SESSION_SECRET: 'PASTE_YOUR_RANDOM_KEY_HERE'
    ports:
      - '3456:3456'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # ─────────────────────────────────────────────────────────────────────────
      # VOLUME 1: Aperture Libraries Output
      # ─────────────────────────────────────────────────────────────────────────
      # IMPORTANT: Create this folder INSIDE your media share!
      #
      # Why inside? Because your media server already has your media share
      # mounted, so it will automatically see this folder too. No need to add
      # another mount to Emby/Jellyfin!
      #
      # Unraid Example:
      #   - Host folder:     /mnt/user/Media/ApertureLibraries
      #   - Emby sees it at: /mnt/ApertureLibraries (automatically!)
      #
      - /mnt/user/Media/ApertureLibraries:/aperture-libraries

      # ─────────────────────────────────────────────────────────────────────────
      # VOLUME 2: Database Backups
      # ─────────────────────────────────────────────────────────────────────────
      # Automatic database backups are stored here. Daily backups run at 2 AM.
      # Keep this on a reliable storage location, ideally separate from the
      # database volume for disaster recovery.
      #
      # Unraid Example:
      #   - Host folder:     /mnt/user/appdata/aperture/backups
      #
      - /mnt/user/appdata/aperture/backups:/backups

      # ─────────────────────────────────────────────────────────────────────────
      # VOLUME 3: Your Media Library (read-only access)
      # ─────────────────────────────────────────────────────────────────────────
      # Aperture needs to read your media files to create symlinks.
      # Mount the SAME media folder that your media server uses.
      # Read-only (:ro) is fine - Aperture only reads, never writes here.
      #
      - /mnt/user/Media:/media:ro
    restart: unless-stopped

volumes:
  pgdata:
